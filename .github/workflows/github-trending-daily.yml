name: Run GitHub Daily Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

env:
  GITHUB_USER_NAME: keeper-jie
  GITHUB_USER_EMAIL: keeper-jie@users.noreply.github.com

jobs:
  build:
    name: update
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python Env
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily trending
        run: |
          python daily_trending.py

      - name: Run daily github rising stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python daily_github_stars.py

      - name: Run daily hacker news
        run: |
          python daily_hackernews.py

      - name: Run daily huggingface
        run: |
          python daily_huggingface.py

      - name: Run daily reddit
        run: |
          python daily_reddit.py

      - name: Run daily arxiv
        run: |
          python daily_arxiv.py

      - name: Run daily devto
        run: |
          python daily_devto.py

      - name: Run daily lobsters
        run: |
          python daily_lobsters.py

      - name: Run daily hf papers
        run: |
          python daily_hf_papers.py

      - name: Generate manifest
        run: |
          python generate_manifest.py

      - name: Commit and push changes
        run: |
          git config user.name "${{ env.GITHUB_USER_NAME }}"
          git config user.email "${{ env.GITHUB_USER_EMAIL }}"
          git add README.md json/ md/ data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Github Action Automatic Update Daily Digest"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
          fi
