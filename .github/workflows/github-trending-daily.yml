name: Run GitHub Daily Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

env:
  GITHUB_USER_NAME: keeper-jie
  GITHUB_USER_EMAIL: keeper-jie@users.noreply.github.com

jobs:
  build:
    name: update
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python Env
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily trending
        run: |
          python daily_trending.py

      - name: Run daily github rising stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python daily_github_stars.py

      - name: Run daily hacker news
        run: |
          python daily_hackernews.py

      - name: Run daily huggingface
        run: |
          python daily_huggingface.py

      - name: Generate manifest
        run: |
          python generate_manifest.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Github Action Automatic Update Daily Digest"
          file_pattern: "README.md json/**/*.json md/**/*.md data/**/*.json index.html"
          commit_user_name: ${{ env.GITHUB_USER_NAME }}
          commit_user_email: ${{ env.GITHUB_USER_EMAIL }}
